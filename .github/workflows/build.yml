name: Build Telegram APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant execute permission for gradlew
      working-directory: Telegram-master
      run: chmod +x gradlew

    - name: Build with Gradle
      working-directory: Telegram-master
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: telegram-debug-apk
        path: Telegram-master/TMessagesProj/build/outputs/apk/debug/TMessagesProj-debug.apk